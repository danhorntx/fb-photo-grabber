<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aperture</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="root">
    <div class="grain" aria-hidden="true"></div>

    <header class="hero">
      <span class="eyebrow"><span class="dot"></span> Photo grabber</span>
      <h1 class="title">Aperture<span class="serif">.</span></h1>
    </header>

    <section class="status" id="status">
      <div class="status-inner">
        <div class="status-head">
          <span class="status-dot" id="statusDot"></span>
          <span class="status-text" id="statusText">Reading the active tab…</span>
        </div>
        <div class="meta-grid">
          <div class="meta-cell">
            <span class="meta-label">Album</span>
            <span class="meta-value" id="albumName">—</span>
          </div>
          <div class="meta-cell">
            <span class="meta-label">Photos</span>
            <span class="meta-value" id="photoCount">—</span>
          </div>
        </div>
      </div>
    </section>

    <button class="cta" id="ctaBtn" disabled>
      <span class="cta-label" id="ctaLabel">Working…</span>
      <span class="cta-arrow" id="ctaArrow">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 4v12"/><path d="m6 12 6 6 6-6"/><path d="M5 20h14"/>
        </svg>
      </span>
    </button>

    <div class="progress" id="progressWrap">
      <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
      <span class="progress-label" id="progressLabel">&nbsp;</span>
    </div>

    <div class="error-banner" id="errorBanner" hidden>
      <span class="error-dot"></span>
      <span id="errorText"></span>
    </div>

    <footer class="foot">
      <span>v1.1</span>
      <span class="dot-mini"></span>
      <span>Saves to <em>Downloads / Aperture</em></span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
